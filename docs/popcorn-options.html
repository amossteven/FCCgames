<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Popcorn options · Pop & Clap</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFEBE4;--ink:#1B1B1B;--orange:#E8632B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:30px;line-height:1;margin:0 0 6px}
h1 span{color:var(--orange)}
p.lead{margin:0 0 18px;color:#444;font-size:15px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.opt{background:#FBF9F6;border:2px solid var(--ink);border-radius:18px;padding:14px;box-shadow:5px 5px 0 var(--ink)}
.opt.now{opacity:.85;border-style:dashed;box-shadow:none}
.opt h2{font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:15px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.opt h2 b{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--orange);align-items:center;justify-content:center;font-size:13px}
.opt p{margin:0 0 10px;font-size:13px;color:#555;min-height:34px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.top svg.big{width:112px;height:112px;flex:none}
.top .sizes{display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:11px;color:#777}
.top .sizes span{display:flex;align-items:center;gap:8px}
.board{background:var(--ink);border:4px solid var(--orange);border-radius:14px;padding:6px;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hole{aspect-ratio:1;border-radius:50%;background:#2E2E2E;border:2px solid #3A3A3A;position:relative}
.hole svg{position:absolute;inset:6%;width:88%;height:88%}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="tok-clap" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="19" fill="#F3EFE8"/>
      <rect x="7" y="17" width="26" height="15" rx="2" fill="#1B1B1B"/>
      <rect x="7" y="9" width="26" height="7" rx="1.5" fill="#1B1B1B"/>
      <path d="M9 9l5 7M16 9l5 7M23 9l5 7M30 9l3 4" stroke="#F3EFE8" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="10" y="21" width="11" height="2" fill="#F3EFE8"/>
      <rect x="10" y="25.5" width="8" height="2" fill="#F3EFE8"/>
      <circle cx="8.5" cy="16.5" r="1.6" fill="#E8632B"/>
    </symbol>

    <!-- CURRENT: all-gold kernel on pale yellow -->
    <symbol id="pop-now" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="19" fill="#FFF3D1"/>
      <g fill="#B8780E"><circle cx="20" cy="22" r="10.4"/><circle cx="20" cy="11.5" r="6.9"/><circle cx="12.5" cy="15" r="6.6"/><circle cx="27.5" cy="15" r="6.6"/><circle cx="10" cy="24" r="6.4"/><circle cx="30" cy="24" r="6.4"/><circle cx="14" cy="30" r="6.2"/><circle cx="26" cy="30" r="6.2"/></g>
      <g fill="#F7C843"><circle cx="20" cy="22" r="9"/><circle cx="20" cy="11.5" r="5.5"/><circle cx="12.5" cy="15" r="5.2"/><circle cx="27.5" cy="15" r="5.2"/><circle cx="10" cy="24" r="5"/><circle cx="30" cy="24" r="5"/><circle cx="14" cy="30" r="4.8"/><circle cx="26" cy="30" r="4.8"/></g>
      <g fill="#E6A824"><path d="M9.5 26.5a5 5 0 0 0 5 2.4 4.8 4.8 0 0 0 .3 5.2 4.8 4.8 0 0 1-5.3-7.6z"/><path d="M30.5 26.5a5 5 0 0 1-5 2.4 4.8 4.8 0 0 1-.3 5.2 4.8 4.8 0 0 0 5.3-7.6z"/><path d="M16 33.5a9 9 0 0 0 8 0 4.8 4.8 0 0 1-8 0z"/></g>
      <g fill="none" stroke="#B8780E" stroke-width="1.3" stroke-linecap="round"><path d="M16.5 16.5q2 3.5 0 6.5"/><path d="M23.5 16.5q-2 3.5 0 6.5"/><path d="M15 24.5q2.5 2.5 5.5 2.5"/></g>
      <g fill="#FFF6C8"><circle cx="17.5" cy="10.5" r="1.8"/><circle cx="11" cy="13" r="1.3"/><circle cx="26.5" cy="12.8" r="1.1"/><ellipse cx="16.5" cy="20" rx="2.2" ry="1.5"/></g>
    </symbol>

    <!-- one popped kernel, reused: ink outline, white fluff, butter shading, amber hull -->
    <g id="kernel">
      <g fill="#1B1B1B"><circle cx="20" cy="21" r="9.4"/><circle cx="14" cy="14.5" r="8.2"/><circle cx="24" cy="12" r="7.2"/><circle cx="29.5" cy="19.5" r="6.6"/><circle cx="26" cy="28.5" r="7.2"/><circle cx="15.5" cy="29" r="6.8"/><circle cx="10" cy="22.5" r="6.2"/></g>
      <g fill="#F2C867"><circle cx="20" cy="21" r="8"/><circle cx="14" cy="14.5" r="6.8"/><circle cx="24" cy="12" r="5.8"/><circle cx="29.5" cy="19.5" r="5.2"/><circle cx="26" cy="28.5" r="5.8"/><circle cx="15.5" cy="29" r="5.4"/><circle cx="10" cy="22.5" r="4.8"/></g>
      <g fill="#FFFBF0"><circle cx="19.2" cy="20" r="7.6"/><circle cx="13.2" cy="13.6" r="6.3"/><circle cx="23.3" cy="11.2" r="5.3"/><circle cx="28.8" cy="18.7" r="4.6"/><circle cx="25.2" cy="27.5" r="5.1"/><circle cx="14.8" cy="28" r="4.7"/><circle cx="9.4" cy="21.7" r="4.2"/></g>
      <g fill="none" stroke="#C9973A" stroke-width="1.1" stroke-linecap="round"><path d="M18.5 9.5q-1.5 3 .5 5.5"/><path d="M26.5 15q-2.5 1-3.5 3.5"/><path d="M10.5 18.5q3 .5 4.5 3"/><path d="M21 31.5q-.5-3 1.5-5"/></g>
      <path d="M16.2 21.2c1.2-2.4 5.6-2.6 7.2-.2.9 2.9-.9 5.6-3.5 5.6s-4.5-2.500-3.700-5.400z" fill="#E39A22" stroke="#9A5A10" stroke-width=".9"/>
      <path d="M17.8 21.6c1.300-1 3.200-1 4.300 0" fill="none" stroke="#FFD98A" stroke-width="1" stroke-linecap="round"/>
    </g>

    <!-- A: fluffy white kernel on the FCC orange -->
    <symbol id="pop-a" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="19" fill="#E8632B"/>
      <use href="#kernel"/>
    </symbol>

    <!-- B: classic striped box, overflowing -->
    <symbol id="pop-b" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="19" fill="#FFE9A8"/>
      <g fill="#1B1B1B"><circle cx="13.500" cy="16" r="5.200"/><circle cx="20" cy="12" r="6.200"/><circle cx="26.500" cy="16" r="5.200"/><circle cx="16.500" cy="18.500" r="4.600"/><circle cx="23.500" cy="18.500" r="4.600"/></g>
      <g fill="#FFFBF0"><circle cx="13.500" cy="16" r="4"/><circle cx="20" cy="12" r="5"/><circle cx="26.500" cy="16" r="4"/></g>
      <g fill="#FFD25E"><circle cx="16.500" cy="18.500" r="3.400"/><circle cx="23.500" cy="18.500" r="3.400"/></g>
      <g fill="none" stroke="#C9973A" stroke-width="1" stroke-linecap="round"><path d="M18 10.500q1.500 1.500 3.500.500"/><path d="M12 15q1.500 1 2.500 0"/><path d="M25.500 15q1.500 1 2.500 0"/></g>
      <path d="M10.500 19h19l-3 15.500h-13z" fill="#FFFBF0" stroke="#1B1B1B" stroke-width="1.400" stroke-linejoin="round"/>
      <g fill="#D93A2B"><path d="M10.500 19h3.800l-1.200 15.500h-2.600l-.600-3z" transform="translate(.7 0)"/><path d="M18.100 19h3.800l-.600 15.500h-2.600z"/><path d="M25.700 19h3.800l-3 15.500h-2z"/></g>
      <path d="M10.500 19h19l-3 15.500h-13z" fill="none" stroke="#1B1B1B" stroke-width="1.400" stroke-linejoin="round"/>
      <path d="M9.800 19h20.400" stroke="#1B1B1B" stroke-width="2.200" stroke-linecap="round"/>
    </symbol>

    <!-- C: buttery kernel on a striped popcorn-box disc -->
    <symbol id="pop-c" viewBox="0 0 40 40">
      <clipPath id="disc-c"><circle cx="20" cy="20" r="19"/></clipPath>
      <g clip-path="url(#disc-c)">
        <rect x="0" y="0" width="40" height="40" fill="#FFF8EC"/>
        <g fill="#D93A2B"><rect x="1" y="0" width="5.430" height="40"/><rect x="11.860" y="0" width="5.430" height="40"/><rect x="22.710" y="0" width="5.430" height="40"/><rect x="33.570" y="0" width="5.430" height="40"/></g>
      </g>
      <g transform="translate(20 20.500) scale(.86) translate(-20 -20.500)"><use href="#kernel"/></g>
    </symbol>

    <!-- D: a little handful, three kernels -->
    <g id="mini">
      <g fill="#1B1B1B"><circle cx="0" cy="0" r="6.200"/><circle cx="-4.500" cy="-3" r="4.700"/><circle cx="3.500" cy="-4.500" r="4.700"/><circle cx="5" cy="2.500" r="4.500"/><circle cx="-3" cy="4.500" r="4.500"/></g>
      <g class="shade"><circle cx="0" cy="0" r="5"/><circle cx="-4.500" cy="-3" r="3.500"/><circle cx="3.500" cy="-4.500" r="3.500"/><circle cx="5" cy="2.500" r="3.300"/><circle cx="-3" cy="4.500" r="3.300"/></g>
      <g class="body"><circle cx="-.6" cy="-.7" r="4.700"/><circle cx="-5" cy="-3.600" r="3.100"/><circle cx="3" cy="-5.100" r="3.100"/><circle cx="4.500" cy="1.900" r="2.900"/><circle cx="-3.500" cy="3.900" r="2.900"/></g>
      <path d="M-2.400.300c1-1.700 3.800-1.700 4.800 0 .400 1.900-.800 3.400-2.400 3.400s-2.800-1.500-2.400-3.400z" fill="#E39A22" stroke="#9A5A10" stroke-width=".7"/>
    </g>
    <symbol id="pop-d" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="19" fill="#E8632B"/>
      <g transform="translate(20 13)" style="--s:#F2C867;--b:#FFFBF0"><use href="#mini"/></g>
      <g transform="translate(12.500 25.500) rotate(-25)" style="--s:#E9A92B;--b:#FFD25E"><use href="#mini"/></g>
      <g transform="translate(27.500 25.500) rotate(20)" style="--s:#F2C867;--b:#FFFBF0"><use href="#mini"/></g>
    </symbol>
  </defs>
  <style>#mini .shade{fill:var(--s)}#mini .body{fill:var(--b)}</style>
</svg>

<main>
  <h1>Popcorn options<span>.</span></h1>
  <p class="lead">Four new designs for the popcorn piece in Pop &amp; Clap, each shown large, at the size it is on the board in the chat, and next to the clapperboard. The current piece is last, for comparison.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
const OPTS = [
  ['A', 'pop-a', 'Fluffy white kernel', 'One popped kernel, but white and fluffy with a buttery heart, on FCC orange. Keeps your single-popcorn idea; the two sides become cream vs orange.'],
  ['B', 'pop-b', 'Striped box', 'The classic red-and-white cinema box, overflowing. The most instantly recognisable popcorn there is.'],
  ['C', 'pop-c', 'Kernel on stripes', 'A single kernel sitting on a red-and-white striped disc, so the piece itself looks like a popcorn box from above.'],
  ['D', 'pop-d', 'Handful of three', 'Three small kernels, white and buttery, on FCC orange. Popcorn reads better in a bunch.'],
  ['Now', 'pop-now', 'Current piece', 'The all-gold kernel in the game today.'],
];
const use = (id, cls) => `<svg class="${cls || ''}" viewBox="0 0 40 40"><use href="#${id}"/></svg>`;
const LAYOUT = ['c', 'p', '', 'p', 'c', 'p', 'p',  'c', 'c', 'p', 'c', 'p', 'c', 'c'];
document.getElementById('grid').innerHTML = OPTS.map(([k, id, name, blurb]) => `
  <div class="opt${k === 'Now' ? ' now' : ''}">
    <h2>${k === 'Now' ? '' : `<b>${k}</b>`}${name}</h2><p>${blurb}</p>
    <div class="top">${use(id, 'big')}
      <div class="sizes"><span>${use(id).replace('<svg', '<svg width="44" height="44"')} board size</span><span>${use(id).replace('<svg', '<svg width="24" height="24"')} small</span></div></div>
    <div class="board">${LAYOUT.map(t => `<div class="hole">${t ? use(t === 'c' ? 'tok-clap' : id) : ''}</div>`).join('')}</div>
  </div>`).join('');
</script>
</body>
</html>
