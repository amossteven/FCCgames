<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pop & Clap · FCC Games</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/fcc.css?v=4">
<style>
.boardwrap{background:#1B1B1B;border:5px solid var(--orange);border-radius:16px;padding:8px;box-shadow:var(--shadow);max-width:420px;margin:0 auto}
body.bare .boardwrap{border-width:4px;padding:6px;box-shadow:none;max-width:none}
.cols{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.colbtn{font-weight:800;font-size:14px;background:#EFEBE4;color:#1B1B1B;border:2px solid #EFEBE4;border-radius:999px;padding:3px 0;cursor:pointer;line-height:1.2;transition:background .1s}
.colbtn:hover{background:var(--orange);border-color:var(--orange)}
.colbtn.pop{background:#1B1B1B;color:var(--orange);border-color:var(--orange)}
.colbtn.pop:hover{background:var(--orange);color:#1B1B1B}
.colbtn[disabled]{opacity:.25;cursor:not-allowed}
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.hole{aspect-ratio:1;border-radius:50%;background:#2E2E2E;border:2px solid #3A3A3A;position:relative;overflow:hidden}
.hole.canplay{cursor:pointer}
.hole.canplay:hover{border-color:var(--orange)}
.hole.last{box-shadow:0 0 0 3px var(--yellow)}
.tok{position:absolute;inset:6%;width:88%;height:88%}
.tok.new{animation:dropin .45s cubic-bezier(.3,1.3,.5,1)}
@keyframes dropin{from{transform:translateY(-500%)}to{transform:translateY(0)}}
.hole.winline{border-color:var(--yellow);box-shadow:0 0 0 3px var(--yellow),0 0 16px var(--yellow)}
.legend{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px;color:#EFEBE4}
.legend .tok{position:static;width:24px;height:24px}
.legend .who{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.legend .cut{font-weight:700;font-size:11px;color:#A8A39B}
.legend .cut b{color:var(--orange)}
.actions{display:flex;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap}
body.bare .actions .btn{font-size:11px;padding:7px 12px}
body.bare h2{display:none}
body.bare .panel.turn{padding:0;border:0;box-shadow:none;background:transparent;margin:0}
body.bare .panel.boardonly{padding:0;border:0;box-shadow:none;background:transparent;margin:0}
.hint{text-align:center;font-size:12px;color:var(--muted);margin:6px 0 0}
</style>
</head>
<body>
<div id="fcc-header"></div>
<!-- the two tokens: a mini clapperboard and a popcorn bucket -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="tok-clap" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="19" fill="#F3EFE8"/>
      <rect x="7" y="17" width="26" height="15" rx="2" fill="#1B1B1B"/>
      <rect x="7" y="9" width="26" height="7" rx="1.5" fill="#1B1B1B"/>
      <path d="M9 9l5 7M16 9l5 7M23 9l5 7M30 9l3 4" stroke="#F3EFE8" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="10" y="21" width="11" height="2" fill="#F3EFE8"/>
      <rect x="10" y="25.5" width="8" height="2" fill="#F3EFE8"/>
      <circle cx="8.5" cy="16.5" r="1.6" fill="#E8632B"/>
    </symbol>
    <symbol id="tok-pop" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="19" fill="#FFF3D1"/>
      <!-- outline layer: the same lobes, slightly larger, in deep gold -->
      <g fill="#B8780E">
        <circle cx="20" cy="22" r="10.4"/><circle cx="20" cy="11.5" r="6.9"/><circle cx="12.5" cy="15" r="6.6"/><circle cx="27.5" cy="15" r="6.6"/>
        <circle cx="10" cy="24" r="6.4"/><circle cx="30" cy="24" r="6.4"/><circle cx="14" cy="30" r="6.2"/><circle cx="26" cy="30" r="6.2"/>
      </g>
      <!-- body -->
      <g fill="#F7C843">
        <circle cx="20" cy="22" r="9"/><circle cx="20" cy="11.5" r="5.5"/><circle cx="12.5" cy="15" r="5.2"/><circle cx="27.5" cy="15" r="5.2"/>
        <circle cx="10" cy="24" r="5"/><circle cx="30" cy="24" r="5"/><circle cx="14" cy="30" r="4.8"/><circle cx="26" cy="30" r="4.8"/>
      </g>
      <!-- buttery shading on the lower lobes -->
      <g fill="#E6A824">
        <path d="M9.5 26.5a5 5 0 0 0 5 2.4 4.8 4.8 0 0 0 .3 5.2 4.8 4.8 0 0 1-5.3-7.6z"/>
        <path d="M30.5 26.5a5 5 0 0 1-5 2.4 4.8 4.8 0 0 1-.3 5.2 4.8 4.8 0 0 0 5.3-7.6z"/>
        <path d="M16 33.5a9 9 0 0 0 8 0 4.8 4.8 0 0 1-8 0z"/>
      </g>
      <!-- creases between the lobes -->
      <g fill="none" stroke="#B8780E" stroke-width="1.3" stroke-linecap="round">
        <path d="M16.5 16.5q2 3.5 0 6.5"/><path d="M23.5 16.5q-2 3.5 0 6.5"/><path d="M15 24.5q2.5 2.5 5.5 2.5"/>
      </g>
      <!-- highlights -->
      <g fill="#FFF6C8">
        <circle cx="17.5" cy="10.5" r="1.8"/><circle cx="11" cy="13" r="1.3"/><circle cx="26.5" cy="12.8" r="1.1"/><ellipse cx="16.5" cy="20" rx="2.2" ry="1.5"/>
      </g>
    </symbol>
  </defs>
</svg>
<main id="app" class="wrap"></main>
<script src="../shared/fcc.js?v=9"></script>
<script>
const W = 7, H = 6;
const TOKEN = ['tok-clap', 'tok-pop'];       // seat 0 claps, seat 1 pops
const NAME = ['clapperboard', 'popcorn'];
function newState(players, seed) { return { p: players, seed, b: '0'.repeat(W * H), cut: [1, 1], n: 0 }; }
const at = (b, c, r) => +b[r * W + c];
const set = (b, c, r, v) => b.slice(0, r * W + c) + v + b.slice(r * W + c + 1);

function winLine(b, who) {
  const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    if (at(b, c, r) !== who) continue;
    for (const [dx, dy] of dirs) {
      const cells = [[c, r]];
      for (let k = 1; k < 4; k++) { const cc = c + dx * k, rr = r + dy * k; if (cc < 0 || cc >= W || rr < 0 || rr >= H || at(b, cc, rr) !== who) break; cells.push([cc, rr]); }
      if (cells.length === 4) return cells.map(([x, y]) => y * W + x);
    }
  }
  return null;
}
function dropRow(b, c) { for (let r = H - 1; r >= 0; r--) if (at(b, c, r) === 0) return r; return -1; }
function popColumn(b, c) {
  let col = []; for (let r = 0; r < H; r++) col.push(at(b, c, r));
  col.pop(); col.unshift(0);
  for (let r = 0; r < H; r++) b = set(b, c, r, col[r]);
  return b;
}
const token = (who, cls = '') => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'tok ' + cls); const u = document.createElementNS('http://www.w3.org/2000/svg', 'use'); u.setAttribute('href', '#' + TOKEN[who]); s.append(u); return s; };

function boardEl(state, opts = {}) {
  const b = state.b, wl = (state.over && state.over.line) || [];
  const last = state.last && state.last.cell != null ? state.last.cell : -1;
  const cols = FCC.h('div', { class: 'cols' });
  for (let c = 0; c < W; c++) {
    const full = dropRow(b, c) === -1;
    const popOK = opts.popMode && at(b, c, H - 1) === opts.me + 1;
    const disabled = !opts.onCol || (opts.popMode ? !popOK : full);
    cols.append(FCC.h('button', { class: 'colbtn' + (opts.popMode ? ' pop' : ''), disabled, 'aria-label': (opts.popMode ? 'Pull from column ' : 'Drop in column ') + (c + 1), onClick: () => opts.onCol(c) }, opts.popMode ? '▲' : '▼'));
  }
  const grid = FCC.h('div', { class: 'board' });
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const v = at(b, c, r), i = r * W + c;
    const canplay = opts.onCol && !opts.popMode && dropRow(b, c) !== -1;
    const hole = FCC.h('div', { class: 'hole' + (i === last && !opts.popMode ? ' last' : '') + (wl.includes(i) ? ' winline' : '') + (canplay ? ' canplay' : ''), onClick: canplay ? () => opts.onCol(c) : null });
    if (v) hole.append(token(v - 1, i === last && opts.animate ? 'new' : ''));
    grid.append(hole);
  }
  const wrap = FCC.h('div', { class: 'boardwrap' }, opts.onCol ? cols : null, grid);
  if (!FCC.compact) wrap.append(FCC.h('div', { class: 'legend' },
    FCC.h('span', { class: 'who' }, token(0), state.p[0]),
    FCC.h('span', { class: 'cut' }, `Director's Cut: ${state.p[0]} `, FCC.h('b', {}, state.cut[0] ? '●' : '○'), ` · ${state.p[1]} `, FCC.h('b', {}, state.cut[1] ? '●' : '○')),
    FCC.h('span', { class: 'who' }, state.p[1], token(1))));
  return wrap;
}

function renderTurn(state, api, root) {
  const me = state.n, you = 1 - me;
  let popMode = false;
  root.append(FCC.replayPanel(state));
  const panel = FCC.h('div', { class: 'panel accent turn' });
  const draw = () => {
    panel.innerHTML = '';
    panel.append(FCC.h('h2', {}, popMode ? "🎬 Director's Cut — pick a column to pull your bottom piece" : `Your move, ${state.p[me]} — drop a ${NAME[me]}`),
      boardEl(state, { me, popMode, animate: !popMode, onCol: c => popMode ? pop(c) : drop(c) }),
      FCC.h('div', { class: 'actions' },
        state.cut[me] ? FCC.h('button', { class: 'btn ' + (popMode ? 'ghost' : 'primary') + ' sm', onClick: () => { FCC.sfx.click(); popMode = !popMode; draw(); } }, popMode ? '✖ CANCEL CUT' : "🎬 DIRECTOR'S CUT") : null,
        FCC.compact ? FCC.h('span', { class: 'hint' }, popMode ? 'Pull one of your own bottom pieces' : `Tap a column to drop a ${NAME[me]}`) : null));
  };
  const finish = (text, cell) => api.commit({ by: me, text, cell });
  const drop = c => {
    const r = dropRow(state.b, c); if (r < 0) return;
    FCC.sfx.drop();
    state.b = set(state.b, c, r, me + 1);
    const line = winLine(state.b, me + 1);
    if (line) state.over = { winner: me, line, reason: 'Four in a row!' };
    else if (!state.b.includes('0')) state.over = { winner: null, reason: 'Board full — a draw.' };
    else state.n = you;
    finish(`${state.p[me]} dropped a ${NAME[me]} in column ${c + 1}` + (line ? ' and connected FOUR!' : '.'), r * W + c);
  };
  const pop = c => {
    if (at(state.b, c, H - 1) !== me + 1) return;
    FCC.sfx.good();
    state.cut[me] = 0;
    state.b = popColumn(state.b, c);
    const mineL = winLine(state.b, me + 1), theirsL = winLine(state.b, you + 1);
    let text = `${state.p[me]} used their DIRECTOR'S CUT on column ${c + 1}`;
    if (mineL && theirsL) { state.over = { winner: null, line: mineL, reason: 'Both players connected four at once!' }; text += ' — and BOTH players connected four. Draw!'; }
    else if (mineL) { state.over = { winner: me, line: mineL, reason: 'Four in a row via a cheeky edit!' }; text += ' and connected FOUR!'; }
    else if (theirsL) { state.over = { winner: you, line: theirsL, reason: 'The cut handed four in a row to the opponent.' }; text += ` — oops, it gave ${state.p[you]} four in a row!`; }
    else { state.n = you; text += '. The column shifts down…'; }
    finish(text, null);
  };
  draw(); root.append(panel);
}
function renderBoard(state) { return FCC.h('div', { class: 'panel boardonly' }, boardEl(state, {})); }

FCC.app({
  id: 'popclap', title: 'Pop & Clap', emoji: '🎬',
  blurb: 'Connect Four at the pictures: clapperboards vs popcorn. Plus one Director\'s Cut each — pull your bottom piece and watch the column drop.',
  howTo: `<ul>
    <li>Take turns dropping a piece into one of seven columns — tap a column. First to connect <b>four</b> in a row (across, down or diagonally) wins.</li>
    <li>Each player has one <b>Director's Cut</b> per game: instead of dropping, pull your own bottom piece out of a column. Everything above it falls one row.</li>
    <li>A cut can win you the game… or hand four in a row to your opponent. If it connects four for both of you, it's a draw.</li>
    <li>Board full with no winner = draw. Rematch: the loser goes first.</li>
  </ul>`,
  newState, renderTurn, renderBoard
});
</script>
</body>
</html>
